services:
  - type: web
    runtime: static
    name: portfolio-web
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist/web
    envVars:
      - key: VITE_PUBLIC_SITE_URL
        sync: false
      - key: VITE_PUBLIC_POSTHOG_KEY
        sync: false
      - key: VITE_PUBLIC_POSTHOG_HOST
        sync: false
      - key: VITE_EMAILJS_SERVICE_ID
        sync: false
      - key: VITE_EMAILJS_TEMPLATE_ID
        sync: false
      - key: VITE_EMAILJS_PUBLIC_KEY
        sync: false
      - key: VITE_PUBLIC_DATA_SOURCE
        value: repository
      - key: VITE_ALLOW_REMOTE_PUBLIC_DATA
        value: "true"
      - key: VITE_CMS_REPOSITORY_URL
        sync: false
      - key: VITE_SUPABASE_MEDIA_MODE
        value: lazy
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - data/fallback/**
        - scripts/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /cms-assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  - type: web
    runtime: static
    name: portfolio-cms
    buildCommand: npm ci && npm run build:cms
    staticPublishPath: ./dist/cms
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PUBLIC_SITE_URL
        sync: false
      - key: VITE_PUBLIC_POSTHOG_KEY
        sync: false
      - key: VITE_PUBLIC_POSTHOG_HOST
        sync: false
    buildFilter:
      paths:
        - apps/cms/**
        - packages/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow

  - type: web
    runtime: node
    name: portfolio-api
    buildCommand: npm ci
    startCommand: npm run start:api
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CMS_API_ALLOW_ORIGIN
        sync: false
      - key: CMS_PROVIDER_TIMEOUT_MS
        value: 3000
      - key: CMS_REPOSITORY_PROVIDER_ORDER
        value: supabase,turso,static
      - key: CMS_MEDIA_MANIFEST_PATH
        value: data/fallback/media-manifest.json
      - key: CMS_PUBLIC_ASSET_BASE_URL
        sync: false
      - key: CMS_DISABLE_MEDIA_REWRITE
        value: "true"
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - data/fallback/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
